name: CI

on:
  pull_request:
  push:
    branches: [main] # sem isso o Render não vê nenhum check no merge e não publica

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }} # nunca cancela a verificação da main

permissions:
  contents: read

jobs:
  qualidade:
    name: Typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # só para o Prisma validar o schema; nada aqui conecta a banco algum
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm run test:cov

  integracao:
    name: Testes de integração (Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: simulado_teste
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TESTE: postgresql://postgres:teste@localhost:5432/simulado_teste
      DATABASE_URL: postgresql://postgres:teste@localhost:5432/simulado_teste
      DIRECT_URL: postgresql://postgres:teste@localhost:5432/simulado_teste
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:int:preparar
      - run: npm run test:int